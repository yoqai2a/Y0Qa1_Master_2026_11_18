# ============================================================================
# Configuración de la descarga de archivos fNNN (GFS / NOMADS)
# Lo lee _1_GetFnnn/Main_Fnnn.py. Las rutas relativas parten de la raíz del
# proyecto (la carpeta Y0Qa1_v03).
#
# Frecuencia: GFS publica un ciclo cada 6 h (00, 06, 12, 18 UTC). La descarga
# automática en GitHub se programa en .github/workflows/GetFnnn.yml (cron cada
# 6 h, desfasado para correr cuando el ciclo ya está publicado).
# ============================================================================

[modelo]
url_base = "https://nomads.ncep.noaa.gov/cgi-bin"                      # filtro de NOMADS
url_prod = "https://nomads.ncep.noaa.gov/pub/data/nccf/com/gfs/prod"   # listado de ciclos
resolucion = "0p25"        # 0p25, 0p50 o 1p00
conjunto = "YoQai"          # debe existir como [conjuntos.<nombre>] más abajo
parametros_extra = []      # nombres NOMADS sin =on, ej. ["var_PRATE"]
paso_fino_horas = 1        # cada 1 h en los primeros días
dias_horarios = 3          # día 0 más dos días; el tercero cierra a 03Z
dias_maximos = 7           # límite absoluto de pronóstico
hora_cierre_utc = 3        # 00:00 hora local UTC-3
area = "SCGU"          # debe existir como [areas.<nombre>] más abajo (o usar --area)

# ----------------------------------------------------------------------------
# FLUJO tras la descarga
#   crear_nc = false  -> solo descarga: los fNNN (GRIB) se guardan en carpeta_salida.
#   crear_nc = true   -> al terminar la descarga sin errores continúa con _2_CreaNC y
#                        crea los .nc. Si la conversión termina bien, los fNNN se
#                        eliminan y solo quedan los .nc (ver [entrada] eliminar_fnnn
#                        en _2_CreaNC/__Configuracion_NC.toml para conservarlos).
# Si la descarga tiene errores o la conversión falla, los fNNN se conservan.
# También se puede elegir por consola: --crear-nc  /  --solo-fnnn
# ----------------------------------------------------------------------------
[flujo]
crear_nc = true

[areas.SCGU]
norte = -50.0
sur = -90.0
oeste = -85.0
este = -55.0

[areas.FIR_SCCZ]
norte = -40.0
sur = -65.0
oeste = -100.0
este = -50.0

[ciclos]
retraso_publicacion_horas = 4.3   # espera tras la hora nominal del ciclo
exigir_completo = false           # true: solo acepta un ciclo con TODOS los fNNN
                                  # objetivo publicados (si no, usa el anterior)

[descarga]
carpeta_salida = "___Data/___Fnnn"   # se crea <carpeta>/<AAAAMMDD>/<HH>/
conexiones = 32
reintentos = 4
espera_reintento_s = 3.0
tamano_minimo_bytes = 2000
retencion_horas = 72
timeout_conexion_s = 20
timeout_lectura_s = 180

# ----------------------------------------------------------------------------
# CONJUNTOS DE VARIABLES
# Para añadir uno nuevo basta crear otra sección [conjuntos.MiConjunto] y
# poner conjunto = "MiConjunto" en [modelo] (o usar --conjunto en la consola).
# Los niveles se escriben tal cual los nombra NOMADS, sin codificar.
# ----------------------------------------------------------------------------

[conjuntos.FULL]
todas_variables = true
todos_niveles = true

[conjuntos.XyGrib]
variables = [
    "UGRD", "VGRD", "TCDC", "TMP",
    "HGT", "VIS", "PWAT", "RH",
    "DPT", "TMAX", "TMIN", "GUST",
    "APCP", "CSNOW", "SNOD", "CFRZR",
    "CAPE", "CIN", "REFC", "PRMSL",
]
niveles = [
    "0.995_sigma_level", "10_m_above_ground", "925_mb",
    "850_mb", "700_mb", "600_mb",
    "500_mb", "400_mb", "300_mb",
    "200_mb", "2_m_above_ground", "entire_atmosphere",
    "surface", "cloud_ceiling", "0C_isotherm",
