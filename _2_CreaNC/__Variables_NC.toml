# ============================================================================
# Variables que se escriben en los NetCDF (solo estas; el resto de campos del
# GRIB se ignora). Reemplaza a Variables_Clasificadas.json.
#
# Cada [[campo]] = una variable física con una lista de niveles.
#   grupo      "Main" o "Extra" (cualquier texto; sirve para agrupar archivos)
#   shortName  nombre GRIB (pygrib/ecCodes)           -> obligatorio
#   tipoNivel  typeOfLevel de ecCodes                 -> obligatorio
#   niveles    lista de niveles. Un número es el 'level' del GRIB; para capas
#              entre dos superficies usa { level=.., topLevel=.., bottomLevel=.. }
#   stepType   instant (def.), avg, accum, max, min
#   nombre, unidades   informativos (van a los atributos long_name / units)
#   activo = false     desactiva el campo sin borrarlo
#   sufijo     texto que se añade al nombre de cada variable (para distinguir)
#
# Se identifican por nombre, no por número de mensaje, así que sirve con
# cualquier conjunto descargado (FULL, XyGrib, YoQai). Si un campo no está en
# el GRIB simplemente queda vacío (se avisa al final).
#
# Filtros opcionales para campos que el GRIB repite con el mismo nombre:
#   intervalo = "desde_inicio"   solo el acumulado que parte de f000 (0-12 h),
#                                no la ventana de 6 h (6-12 h)
#   ocurrencia = N               el N-ésimo mensaje (en orden de archivo) con
#                                esa misma identidad
#   parametro = "d.c.n"          discipline.parameterCategory.parameterNumber
#                                GRIB2 (véase  --inventario <archivo fNNN>)
#   duplicados = "ultimo"        qué hacer si tras los filtros siguen coincidiendo
#                                varios mensajes en un mismo fNNN: "ultimo" (def.),
#                                "primero" o "error". Se informa al terminar.
#                                Ej.: en f006 GFS trae tp "0-6" dos veces (ventana y
#                                acumulado); el acumulado es el último.
# ============================================================================

